<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Heart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #start-btn {
      position: absolute;
      padding: 12px 24px;
      font-size: 18px;
      color: #fff;
      background: #0091ff;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px #0091ff;
      z-index: 10;
      transition: transform 0.2s, background 0.2s;
    }
    #start-btn:hover {
      background: #4682b4;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <button id="start-btn">Clique para abrir 💙</button>
  <canvas id="canvas"></canvas>
  <audio id="audio" src="love_you.mp3" loop></audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('start-btn');
    const audio = document.getElementById('audio');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const WORDS = ["love you", "Love You", "LOVE YOU"];
    const COLORS = [
      "rgb(70, 130, 180)",
      "rgb(30, 144, 255)",
      "rgb(0, 191, 255)",
      "rgb(100, 149, 237)",
      "rgb(65, 105, 225)"
    ];

    function heartFunction(t, scale = 16) {
      const x = scale * 16 * Math.pow(Math.sin(t), 3);
      const y = -scale * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    const particles = [];
    const totalParticles = 450;

    for (let i = 0; i < totalParticles; i++) {
      const t = Math.random() * Math.PI * 2;
      const isOutline = Math.random() < 0.45;
      const factor = isOutline ? 1 : Math.sqrt(Math.random());
      
      particles.push({
        t: t,
        factor: factor,
        baseScale: 14 + Math.random() * 2,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        word: WORDS[Math.floor(Math.random() * WORDS.length)],
        fontSize: Math.floor(Math.random() * 8 + 10),
        pulseSpeed: 0.03 + Math.random() * 0.02,
        offset: Math.random() * Math.PI * 2
      });
    }

    let frame = 0;
    function animate() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.fillRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2;

      particles.forEach(p => {
        const beat = 1 + 0.08 * Math.sin(frame * p.pulseSpeed + p.offset);
        const pos = heartFunction(p.t, p.baseScale * p.factor * beat);

        ctx.font = `${p.fontSize}px Arial`;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.fillText(p.word, cx + pos.x, cy + pos.y);
      });

      // Texto central pulsante
      const centerPulse = 1 + 0.05 * Math.sin(frame * 0.05);
      ctx.font = `bold ${Math.floor(28 * centerPulse)}px Georgia, serif`;
      ctx.fillStyle = "#ffffff";
      ctx.shadowBlur = 15;
      ctx.shadowColor = "#00bfff";
      ctx.textAlign = "center";
      ctx.fillText("Love You", cx, cy + 10);
      ctx.textAlign = "start";

      frame++;
      requestAnimationFrame(animate);
    }

    btn.addEventListener('click', () => {
      btn.style.display = 'none';
      audio.play().catch(() => {});
      animate();
    });
  </script>
</body>
</html>
